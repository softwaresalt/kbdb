# autoharness Configuration
#
# Resolved harness configuration for this workspace.
# Written by autoharness install; updated by autoharness tune.
# Operator edits to this file are preserved on re-install and tuning.
#
# Schema: schemas/harness-config.schema.json

schema_version: "1.3.0"

# Installation preset: starter | standard | full
preset: full

# Additive stack classification used for composition
primary_stack_pack: mcp-server
stack_packs: 
  - mcp-server
  - cli-tool

# Explicit artifact-class layers selected for installation
install_layers: 
  - foundation
  - instructions
  - workflow
  - review
  - backlog
  - knowledge
  - overlays

# Capability packs enabled for this workspace
capability_packs: 
  - agent-engram
  - backlogit
  - adversarial-review
  - graphtor-docs

# Backlog tool configuration
backlog:
  tool: backlogit
  directory: .backlogit
  suffix_map:
    feature: "F"
    chore: "C"
    task: "T"
    spike: "SP"
    deliberation: "DL"
    bug: "B"
    epic: "E"
    subtask: "ST"
    shipment: "S"

# Long-lived knowledge artifact directories
docs:
  root: docs
  subdirectories:
    compound: compound
    plans: exec-plans
    decisions: decisions
    memory: memory
    closure: closure
    design_docs: design-docs
    product_specs: product-specs

# Optional continuous-learning capability-pack configuration
continuous_learning:
  directory: ".autoharness/continuous-learning"
  capture_hooks: false
  environment_adapter: "none"
  promotion_threshold: 3

# Optional strict-safety capability-pack configuration
strict_safety:
  enabled: true
  require_approval_for:
    - destructive

# Optional graphtor-docs (kbdb) capability-pack configuration
graphtor_docs:
  sources_path: ".kbdb/config/sources.yaml"
  binary_path: "target/release/kbdb"

model_routing:
  tier1:
    model: claude-haiku-5.5              # Fast/cheap: memory, docs, compaction (e.g., gpt-5.4-mini)
    reasoning_effort: "xhigh"  # Leave empty to use model default
    model_provider: "anthropic"       # e.g., openai, anthropic — leave empty for default
    model_family: "claude-haiku-5.5"           # Resolved into Tier 1 agent frontmatter
    context_tier: "long_context"        # context-capacity class (default | long_context)
  tier2:
    model: claude-sonnet-5.5              # Standard: orchestration, code, review (e.g., claude-sonnet-5)
    reasoning_effort: "high"
    model_provider: "anthropic"
    model_family: "claude-sonnet-5.5"
    context_tier: "long_context"
  tier3:
    model: gemini-4-argon              # Frontier: planning, architecture, analysis (e.g., claude-sonnet-5)
    reasoning_effort: "high"
    model_provider: "google"
    model_family: "gemini-4-argon"
    context_tier: "long_context"
  orchestrator:
    model_family: "claude-sonnet-5.5"             # Orchestrator model override
    model_provider: "anthropic"
    reasoning_effort: "medium"
    context_tier: "long_context"
  stage:
    model_family: "gemini-4-argon"             # Stage role route (falls back to tier3 when empty)
    model_provider: "google"
    reasoning_effort: "high"
    context_tier: "long_context"
    escalation:
      model_family: "gpt-6.1-sol"
      model_provider: "openai"
      reasoning_effort: "high"
      context_tier: "long_context"
  ship:
    model_family: "claude-sonnet-5.5"
    model_provider: "anthropic"
    reasoning_effort: "medium"
    context_tier: "long_context" 
    escalation:
      model_family: "claude-sonnet-5.5"
      model_provider: "anthropic"
      reasoning_effort: "high"
      context_tier: "long_context" 
  anchor_review:
    model_provider: "openai"
    model_family: "gpt-6.1-sol"
    reasoning_effort: "high"

# AI CLI tool startup configuration
# Resolves copilot in the generated start.ps1 and start.sh scripts,
# and is read directly by `autoharness run`. Set exe_path to the full path if
# copilot is not on PATH. Use args for flags that should always be passed, e.g.
# ["--remote"].
ai_tools:
  copilot_cli:
    exe_path: "copilot"  # Default: "copilot" (expects it on PATH)
                                      # Example: "C:\\Tools\\ghcpcli\\copilot.exe"
    args: ["--yolo"]  # Default: []

# Sidecar syncs `autoharness run` performs before launching the AI CLI tool.
# Derived at merge-install time from the capability packs enabled for this
# workspace. Omit this key to run every known sidecar (backward-compatible
# default).
sidecars: ["backlogit", "engram"]

# Optional browser-automation capability configuration (used when browser-verification is enabled)
browser:
  cli: "agent-browser"                    # Default: "agent-browser"
  headless_flag: "--headless" # Default: "--headless"

# Optional iterative-experiment skill configuration
experiments:
  branch_prefix: "experiment/"  # Default: "experiment/"
  results_dir: "docs/experiments"       # Default: "docs/experiments"

# Explicit template variable overrides applied during install/tune (use sparingly —
# prefer fixing the workspace setup over overriding discovery results)
overrides: {}
